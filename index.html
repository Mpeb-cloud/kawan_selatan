<!DOCTYPE html>
<html>
<head>
    <title>Febrian bandar ganja Sinte</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background: white;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 8px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .cart {
            background: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .total {
            font-weight: bold;
            margin-top: 10px;
        }

        @media(max-width: 600px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<header>🛒 Febrian Store</header>

<div class="container">

    <div class="card">
        <img src="https://static.vecteezy.com/system/resources/previews/004/297/521/original/cannabis-icon-green-hemp-leaf-ganja-symbol-marijuana-sign-isolated-simple-flat-logo-template-concept-design-for-medicine-isolated-emblem-vector.jpg">
        <div class="card-content">
            <h3>ganja jedud</h3>
            <p>ganja jedud ga jedud uang kembali.</p>
            <p class="price">Rp 150.000</p>
            <button onclick="tambahKeKeranjang('ganja jedud',150000)">Tambah ke Keranjang</button>
        </div>
    </div>

    <div class="card">
        <img src="https://static.vecteezy.com/system/resources/previews/004/297/521/original/cannabis-icon-green-hemp-leaf-ganja-symbol-marijuana-sign-isolated-simple-flat-logo-template-concept-design-for-medicine-isolated-emblem-vector.jpg">
        <div class="card-content">
            <h3>ganja semprot</h3>
            <p>ganja jedud pake banget, tembus akhirat.</p>
            <p class="price">Rp 350.000</p>
            <button onclick="tambahKeKeranjang('ganja semprot',350000)">Tambah ke Keranjang</button>
        </div>
    </div>

    <div class="card">
        <img src="https://static.vecteezy.com/system/resources/previews/004/297/521/original/cannabis-icon-green-hemp-leaf-ganja-symbol-marijuana-sign-isolated-simple-flat-logo-template-concept-design-for-medicine-isolated-emblem-vector.jpg">
        <div class="card-content">
            <h3>sinte 7.1</h3>
            <p>di jamin step der.</p>
            <p class="price">Rp 250.000</p>
            <button onclick="tambahKeKeranjang('sinte 7.1',250000)">Tambah ke Keranjang</button>
        </div>
    </div>

</div>

<div class="cart">
    <h3>🧺 Keranjang</h3>
    <div id="cart-list"></div>
    <div class="total" id="total">Total: Rp 0</div>
    <button onclick="checkout()">Checkout</button>
</div>

<script>
    let keranjang = JSON.parse(localStorage.getItem("keranjang")) || [];

    function simpan() {
        localStorage.setItem("keranjang", JSON.stringify(keranjang));
    }

    function tambahKeKeranjang(nama, harga) {
        let item = keranjang.find(p => p.nama === nama);

        if(item) {
            item.qty += 1;
        } else {
            keranjang.push({nama: nama, harga: harga, qty: 1});
        }

        simpan();
        tampilkanKeranjang();
    }

    function tampilkanKeranjang() {
        let cartList = document.getElementById("cart-list");
        cartList.innerHTML = "";

        let total = 0;

        keranjang.forEach(item => {
            total += item.harga * item.qty;

            cartList.innerHTML += `
                <div class="cart-item">
                    ${item.nama} (x${item.qty})
                    <span>Rp ${(item.harga * item.qty).toLocaleString()}</span>
                </div>
            `;
        });

        document.getElementById("total").innerText =
            "Total: Rp " + total.toLocaleString();
    }

    function checkout() {
        if(keranjang.length === 0) {
            alert("Keranjang kosong 😅");
            return;
        }

        alert("Pembayaran berhasil 🎉");
        keranjang = [];
        simpan();
        tampilkanKeranjang();
    }

    tampilkanKeranjang();
</script>

</body>
</html>
